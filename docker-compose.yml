networks:
  codesync-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  ml_models:
  exec_tmp:
  sonar_tmp:

services:
  # ─── Database ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codesync_dev}
      POSTGRES_DB: ${POSTGRES_DB:-codesync}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-sonar-db.sql:/docker-entrypoint-initdb.d/init-sonar-db.sql
    networks:
      - codesync-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codesync} -d ${POSTGRES_DB:-codesync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - codesync-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible storage) ──────────────────────────
  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - codesync-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── SonarQube ──────────────────────────────────────────────
  sonarqube:
    image: sonarqube:9.9-community
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-codesync}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-codesync_dev}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_CE_JAVAOPTS: "-Xmx512m -Xms64m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx512m -Xms512m -XX:MaxDirectMemorySize=256m"
    ports:
      - "${SONARQUBE_PORT:-9200}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - codesync-net
    shm_size: '512mb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"UP\"' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s

  # ─── ML Worker ──────────────────────────────────────────────
  ml-worker:
    build:
      context: ./ml-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ML_WORKER_PORT:-8000}:8000"
    volumes:
      - ml_models:/app/models
    networks:
      - codesync-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Backend Server ──────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-worker:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-codesync}:${POSTGRES_PASSWORD:-codesync_dev}@db:5432/${POSTGRES_DB:-codesync}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production_32chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production_32chars!}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-7d}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-codesync-storage}
      S3_REGION: ${S3_REGION:-us-east-1}
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_API_PASSWORD: ${SONARQUBE_API_PASSWORD:-admin}
      ML_WORKER_URL: http://ml-worker:8000
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@codesync.dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DOCKER_NETWORK: codesync_codesync-net
      # Shared volume path for code execution temp files.
      # This named volume is mounted at the same path in both server and
      # spawned execution containers so Docker can bind-mount it correctly.
      EXEC_HOST_TMPDIR: /exec_tmp
      EXEC_VOLUME_NAME: codesync_exec_tmp
      SONAR_HOST_TMPDIR: /sonar_tmp
      SONAR_VOLUME_NAME: codesync_sonar_tmp
    ports:
      - "${SERVER_PORT:-3001}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - exec_tmp:/exec_tmp
      - sonar_tmp:/sonar_tmp
    networks:
      - codesync-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Frontend Client ─────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    networks:
      - codesync-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
